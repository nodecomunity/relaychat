else{el.querySelector('#vw').onclick=async()=>{const f=await val(`status/${o}/${k}`)||{},vs=Object.keys(f.views||{});modal(`<h3 style=margin:0>Dilihat oleh ${vs.length}</h3>${vs.map(u=>`<div class=row><div class=av>${ini(contacts[u]?.name||u)}</div><b style=flex:1>${esc(contacts[u]?.name||u)}</b>${f.likes&&f.likes[u]?`<span style="color:#ff4d6d">${ic('heart',20).replace('fill="none"','fill="#ff4d6d"')}</span>`:''}</div>`).join('')||'<p class=mu>Belum ada yang melihat</p>'}<p class=mu>${Object.keys(f.likes||{}).length} suka</p>`)};
el.querySelector('#dl').onclick=async()=>{await remove(R(`status/${o}/${k}`));alert('Status dihapus');close()};
el.querySelector('#sh').onclick=async()=>{try{for(const c in contacts)await sendTo(c,{k:'t',v:'Status: '+(v.text||'media')});alert('Status dibagikan ke kontak')}catch(e){alert('Gagal: '+e.message)}}}}
async function callsView(L){const c=await val('calls/'+S.me)||{};L.innerHTML=Object.values(c).sort((a,b)=>b.at-a.at).map(x=>`<div class=row><div class=av>${x.type=='Video'?ic('video',20):ic('phone',20)}</div><div><b>${esc(x.who)}</b><br><small>${x.dir=='out'?'↗ Keluar':'↙ Masuk'} · ${new Date(x.at).toLocaleString()} · ${Math.floor(x.dur/60)}m ${x.dur%60}d</small></div></div>`).join('')||'<p style="text-align:center;opacity:.6;margin-top:40px">Belum ada riwayat panggilan</p>'}
function profileView(L){const row=(i,t,x)=>`<div class=pr><span class=pi>${ic(i,20)}</span><div style=flex:1><small class=mu>${t}</small>${x}</div></div>`;
L.innerHTML=`<div class=ph><label class=pav style="${U.pp?`background-image:url(${U.pp})`:''}">${U.pp?'':ini(U.name)}<span class=cam>${ic('camera',16)}</span><input type=file id=pp accept=image/*></label><h3 style="margin:10px 0 0">${esc(U.name)}</h3><small class=mu>@${S.me} · Kode ${U.code}</small></div>
<div class=pg>${row('user','Nama',`<input id=nm class=pin value="${esc(U.name)}">`)}${row('info','Info',`<input id=bi class=pin value="${esc(U.bio||'')}">`)}<button class=btn id=sv>Simpan profil</button></div>
<p class=sec>Privasi dan keamanan</p><div class=pg><div class=pr><span class=pi>${ic('shield',20)}</span><div style=flex:1><div>Verifikasi 2 langkah</div><small class=mu>Kode 6 angka diminta saat login</small></div><input type=checkbox id=v2 ${typeof U.v2=='string'&&U.v2?'checked':''}></div><div class=pr id=pw style=cursor:pointer><span class=pi>${ic('key',20)}</span><div>Ganti password</div></div></div>
<p class=sec>Tampilan</p><div class=pg><div class=pr><span class=pi>${ic('status',20)}</span><div style=flex:1>Mode gelap</div><input type=checkbox id=dk ${document.body.classList.contains('light')?'':'checked'}></div>${row('image','Latar chat',`<select id=bg><option value="">Bawaan Relay</option><option value="d1">Biru laut</option><option value="d2">Biru malam</option></select><label class=ft>${ic('image',20)}<span>Dari galeri</span><input type=file id=bgf accept=image/*></label>`)}${row('pencil','Font',`<select id=ft><option>system-ui</option><option>Georgia</option><option>monospace</option><option>Comic Sans MS</option></select>`)}</div>
<div class=pg><div class=pr id=lo style="cursor:pointer;color:#ff5470"><span class=pi style=color:inherit>${ic('out',20)}</span><div>Keluar</div></div></div>`;
const up=async o=>{const old={};for(const k in o)old[k]=U[k];Object.assign(U,o);try{await update(R(`db${S.sh}/users/${S.me}`),o);return 1}catch(e){Object.assign(U,old);alert('Gagal: '+e.message);return 0}};
$('#sv').onclick=async()=>{if(await up({name:$('#nm').value.trim()||U.name,bio:$('#bi').value.trim()})){delete PR[S.me];alert('Profil tersimpan dan bisa dilihat kontak Anda')}profileView(L)};
$('#pp').onchange=async e=>{const f=e.target.files[0];if(!f)return;try{if(await up({pp:await img(f,240)})){delete PR[S.me];alert('Foto profil tersimpan')}}catch(x){alert('Gagal: '+x.message)}profileView(L)};
$('#v2').onchange=async e=>{if(e.target.checked){const c=await codeDlg('Buat kode verifikasi','Kode 6 angka yang diminta saat login',null,1);if(c&&await up({v2:await h2(S.me,c)}))alert('Verifikasi 2 langkah aktif')}else{const c=await codeDlg('Matikan verifikasi 2 langkah','Masukkan kode saat ini',c=>ck2(S.me,c,U.v2));if(c&&await up({v2:null}))alert('Verifikasi 2 langkah dimatikan')}profileView(L)};
$('#pw').onclick=async()=>{const n=await ask('Password baru (min 6 karakter)','',{pw:1});if(n&&n.length>=6){await up({pass:await hash(n)});saveSess(S.me,S.sh,U);alert('Password diganti')}else if(n)alert('Password terlalu pendek')};
$('#dk').onchange=e=>document.body.classList.toggle('light',!e.target.checked);
$('#bg').onchange=e=>{S.bg=e.target.value?'data:image/svg+xml,'+encodeURIComponent(`<svg xmlns="http://www.w3.org/2000/svg" width=4 height=4><rect width=4 height=4 fill="${e.target.value=='d1'?'#d6ecff':'#0f2a44'}"/></svg>`):''};
$('#bgf').onchange=async e=>S.bg=await img(e.target.files[0],700);$('#ft').onchange=e=>document.body.style.fontFamily=e.target.value;$('#lo').onclick=logout}
// ---------- ADMIN ----------
async function adminView(L){L.innerHTML='<p class=mu style="padding:16px">Memuat data...</p>';let us=[];for(let n=1;n<=5;n++){const x=await val(`db${n}/users`)||{};for(const u in x)us.push({u,n,...x[u]})}
const st=await val('stats')||{},days=Object.entries(st).slice(-7),mx=Math.max(1,...days.map(d=>d[1])),rp=await val('reports')||{};if(!$('#L'))return;
L.innerHTML=`<div style=padding:16px><div class=stat><div><b>${us.length}</b><small>Total akun</small></div><div><b>${us.filter(u=>u.ban>Date.now()).length}</b><small>Diban</small></div><div><b>${days.length?days[days.length-1][1]:0}</b><small>Chat hari ini</small></div></div><h4>Chat 7 hari terakhir</h4><div class=chart>${days.map(d=>`<i title="${d[0]}: ${d[1]}" style="height:${Math.max(4,d[1]/mx*100)}%"></i>`).join('')}</div><small class=mu>${days.map(d=>d[0].slice(5)+'='+d[1]).join(' · ')}</small><h4>Semua akun</h4></div>`+us.map(u=>`<div class=row><div class=av>${ini(u.name)}</div><div style=flex:1><b>@${u.u}</b> <small class=mu>DB${u.n}</small><br><small class=mu>${u.ban>Date.now()?'Ban s/d '+new Date(u.ban).toLocaleString():'Aktif'} · ${Object.keys(rp[u.u]||{}).length} laporan</small></div><button data-u=${u.u} data-n=${u.n} class=pl style="background:var(--p)">${u.ban>Date.now()?'Unban':'Ban'}</button></div>`).join('');
L.querySelectorAll('button[data-u]').forEach(b=>b.onclick=async()=>{const pa=`db${b.dataset.n}/users/${b.dataset.u}`,d=await val(pa);let ban=0;if(!(d.ban>Date.now())){const ms=await banDlg(b.dataset.u);if(!ms)return;ban=Date.now()+ms}await update(R(pa),{ban});alert(ban?'Akun diban':'Akun di-unban');adminView(L)})}
const OB=[['chat','Semua dalam satu aplikasi chat','Kirim pesan, foto, video, dokumen dan banyak lagi dengan mudah.'],['users','Terhubung dengan orang-orang terdekat','Buat grup, ajak teman, dan tetap terhubung di mana saja.'],['shield','Aman & Privat','Pesanmu terenkripsi dan data kamu tetap aman.']];
function splash(){A.innerHTML='<div class=center><div class=logo style="width:110px;height:110px;line-height:0">'+ic('chat',56)+'</div><h1 class=glow style="margin:0;font-size:38px">Relay</h1><small style="color:var(--m)">Chat lebih dekat, kapan saja, di mana saja.</small></div>';setTimeout(async()=>{if(await restore())return;localStorage.ob?authView():onb(0)},1200)}
function onb(i){const o=OB[i];A.innerHTML=`<div class=center><div class=logo style="width:130px;height:130px;line-height:0">${ic(o[0],64)}</div><h2 style="margin:10px 0 0">${o[1]}</h2><small style="color:var(--m)">${o[2]}</small><div class=dots>${OB.map((_,j)=>`<i class="${j==i?'on':''}"></i>`).join('')}</div></div><div style="padding:20px;background:var(--bg)"><button class=btn id=nx>${i==2?'Mulai':'Lanjut'}</button></div>`;$('#nx').onclick=()=>i==2?(localStorage.ob=1,authView()):onb(i+1)}
function contactsView(L){L.innerHTML=Object.entries(contacts).map(([k,v])=>`<div class=row data-i=${k}><div class=av data-av=${k}>${ini(v.name)}</div><div style="flex:1"><b>${esc(v.name)}</b><br><small style="color:var(--m)">@${k}</small></div><span style="color:var(--p)">${ic('phone',20)}</span></div>`).join('')||'<p style="text-align:center;color:var(--m);margin-top:40px">Belum ada kontak</p>';L.querySelectorAll('.row').forEach(r=>r.onclick=()=>openChat(r.dataset.i,'u'))}
splash();
</script></body></html>
